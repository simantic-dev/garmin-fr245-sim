# First boot: the firmware formats the QuadSPI NOR first (logo at 54.0 s, language screen at 57.2 s). The button script in overlay.board is timed for the warm boot (scenario.yaml), so its early presses land during the format.
machines:
  dut:
    mcu: MK28FN2M0VMI15
    overlay: overlay.board
    elf: ../out/fr245.elf
media:
  - type: uart
    connect: [dut.lpuart3, dut.link]
  - type: uart
    connect: [dut.lpuart0, dut.cyw]
  - type: ble
    connect: [dut.cyw, dut.phone]
    pcap: ../out/ble.pcap
timeout: 90
